<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR codes das mesas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #17201A; background: #F5F4F0; }
  .barra { padding: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; max-width: 900px; margin: 0 auto; }
  .barra button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #A3134A; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .folha { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; max-width: 900px; margin: 0 auto; padding: 0 16px 32px; }
  .placa { background: #fff; border: 2px solid #12301B; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; break-inside: avoid; }
  .placa .loja { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; color: #12301B; }
  .placa .mesa { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; color: #A3134A; line-height: 1; }
  .placa .qr { width: 220px; height: 220px; }
  .placa .qr svg { width: 100%; height: 100%; }
  .placa p { margin: 0; font-size: 15px; font-weight: 600; }
  .placa small { font-size: 10px; color: #5A615B; word-break: break-all; }
  @media (max-width: 600px) { .folha { grid-template-columns: 1fr; } }
  @media print {
    body { background: #fff; }
    .barra { display: none; }
    .folha { padding: 0; gap: 10mm; }
    @page { margin: 12mm; }
  }
</style>
</head>
<body>
<div class="barra"><span id="info">Carregando…</span><button onclick="print()">Imprimir</button></div>
<div class="folha" id="folha"></div>
<script>
(async () => {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r = await fetch('/api/admin/mesas/qr');
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { document.getElementById('info').textContent = d.erro || 'Entre na área da equipe como administrador.'; return; }
  document.getElementById('info').textContent = d.mesas.length + ' mesas · confira se o endereço abaixo de cada QR é o do seu site';
  // o SVG vem do nosso servidor (gerado pela biblioteca qrcode a partir de um link nosso)
  document.getElementById('folha').innerHTML = d.mesas.map((m) => `<div class="placa">
    <span class="loja">${esc(d.loja)}</span><span class="mesa">${esc(m.nome)}</span>
    <div class="qr" role="img" aria-label="QR code da ${esc(m.nome)}">${m.svg}</div>
    <p>Aponte a câmera e faça seu pedido daqui mesmo</p><small>${esc(m.url)}</small></div>`).join('');
})();
</script>
</body>
</html>
